name: Daily Newspeak AI/ML Newsletter

on:
  schedule:
    # Run every 2 days at 6:00 AM UTC (11:30 AM IST) — on odd days of the month (1,3,5,…)
    - cron: '0 6 */2 * *'
  workflow_dispatch:
    # Allow manually triggering the workflow from GitHub Actions tab

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    # Needed so the workflow can commit the updated sent-article history back to the repo.
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Run Newsletter Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Email delivery: set repo variable EMAIL_PROVIDER=smtp to force Gmail/SMTP
          # even if RESEND_API_KEY is also set. Defaults to "auto" (Resend-first).
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          # Optional ranking-backend tuning (see README):
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          LLM_MAX_CANDIDATES: ${{ vars.LLM_MAX_CANDIDATES }}
          # Optional click-through tracking (see README). Inert unless TRACKING_BASE_URL
          # is set — it points at the deployed Cloudflare Worker.
          TRACKING_BASE_URL: ${{ vars.TRACKING_BASE_URL }}
          TRACKING_SECRET: ${{ secrets.TRACKING_SECRET }}
          TRACKING_STATS_TOKEN: ${{ secrets.TRACKING_STATS_TOKEN }}
          PYTHONPATH: src
        run: |
          uv run python src/newspeak/main.py

      - name: Persist sent-article history & source reputation
        # Runs even after a failed pipeline so a partial state update isn't lost, but only
        # commits when the tracked state files actually changed.
        if: always()
        run: |
          if [[ -n "$(git status --porcelain sent_history.json source_reputation.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_history.json source_reputation.json
            git commit -m "chore: update sent-article history and source reputation"
            git push
          else
            echo "No tracked-state changes to commit."
          fi
