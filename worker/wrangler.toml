# Cloudflare Worker config for the Newspeak click tracker.
#
# One-time setup:
#   1. npm install -g wrangler   (and `wrangler login`)
#   2. wrangler kv namespace create CLICKS
#      → copy the printed `id` into the [[kv_namespaces]] block below.
#   3. wrangler secret put SIGNING_SECRET   # same value as the pipeline's TRACKING_SECRET
#      wrangler secret put STATS_TOKEN      # same value as the pipeline's TRACKING_STATS_TOKEN
#   4. wrangler deploy
#      → copy the deployed https://newspeak-tracker.<subdomain>.workers.dev URL into the
#        pipeline's TRACKING_BASE_URL env var (GitHub Actions secret / .env).
#
# Local testing: `wrangler dev` then curl a signed /r link (see README).

name = "newspeak-tracker"
main = "tracker.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "CLICKS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
